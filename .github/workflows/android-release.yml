# Builds and signs the Android frame app and publishes it as a GitHub release (tagged
# android-v<version>), which frames pick up in their daily update check. Run it by hand from the
# Actions tab: Android release → Run workflow, choose the branch and enter the version number.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of ~/.android/icloud-frame.keystore
#   ANDROID_KEYSTORE_PASSWORD  contents of ~/.android/icloud-frame.keystore.password
name: Android release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number: a whole number higher than the last Android release (e.g. 2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Only one release at a time, and never cancelled halfway
    concurrency:
      group: android-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Earlier tags, to check the version and for the release notes
          fetch-depth: 0

      - name: Check the version
        id: version
        env:
          # Through env rather than inline, so the input can't inject shell
          VERSION: ${{ inputs.version }}
        run: |
          code="$(echo "$VERSION" | tr -d '[:space:]')"
          if ! [[ "$code" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "Version should be a whole number, e.g. 2 (got '$VERSION')" >&2
            exit 1
          fi
          latest=$(git tag --list 'android-v*' | sed 's/^android-v//' | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          # Frames only install a higher version than they have
          if [ -n "$latest" ] && [ "$code" -le "$latest" ]; then
            echo "Version $code isn't higher than the last release, android-v$latest" >&2
            exit 1
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "previous=${latest:+android-v$latest}" >> "$GITHUB_OUTPUT"
          echo "Releasing android-v$code from $GITHUB_REF_NAME at ${GITHUB_SHA::7} (previous: ${latest:-none})"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets first" >&2
            exit 1
          fi
          umask 077
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/icloud-frame.keystore"
          printf '%s' "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/icloud-frame.keystore.password"

      - name: Build and sign
        env:
          KEYSTORE: ${{ runner.temp }}/icloud-frame.keystore
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.code }}
        run: android/build.sh

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/icloud-frame.keystore" "$RUNNER_TEMP/icloud-frame.keystore.password"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.version.outputs.code }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          cp android/build/icloud-frame.apk "icloud-frame-$CODE.apk"
          sha256sum "icloud-frame-$CODE.apk" > "icloud-frame-$CODE.apk.sha256"
          # Creates the android-v<version> tag on the commit that was built; the notes cover the
          # changes since the previous Android release
          gh release create "android-v$CODE" "icloud-frame-$CODE.apk" "icloud-frame-$CODE.apk.sha256" \
            --target "$GITHUB_SHA" --title "Android frame app $CODE" \
            --generate-notes ${PREVIOUS:+--notes-start-tag "$PREVIOUS"}
